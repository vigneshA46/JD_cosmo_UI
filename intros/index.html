<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Venture Kart — Service Intros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/assets/images/logo/vk-emblem-128.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{ --navy:#111A2B; --navy2:#19263E; --silver:#B5AFA6; --silver2:#DAD5CD; --gold:#B59A6A; --gold2:#D8C39A; --ivory:#F2EBDD; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#0B1220; color:var(--ivory); font-family:Inter,system-ui,sans-serif; padding:36px 20px 60px; }
header{ max-width:1100px; margin:0 auto 26px; display:flex; align-items:center; gap:16px; }
header img{ width:58px; }
header h1{ font-family:'Playfair Display',serif; font-size:30px; font-weight:600; }
header p{ color:#9AA4B2; font-size:14px; margin-top:2px; }
header button{ margin-left:auto; height:40px; padding:0 18px; border-radius:10px; border:1px solid rgba(181,175,166,.4); background:none; color:var(--silver2); font:600 13px Inter; cursor:pointer; }
section{ max-width:1100px; margin:0 auto 40px; }
section > h2{ font-family:Cinzel,serif; letter-spacing:.14em; font-size:16px; color:var(--gold2); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid rgba(181,175,166,.15); }
.row{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.opt{ display:flex; flex-direction:column; align-items:center; }
.ph{ position:relative; width:270px; height:560px; border-radius:40px; background:#05080E; padding:9px; box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 0 1.5px #2A3346; }
.scr{ position:absolute; inset:9px; border-radius:32px; overflow:hidden; background:var(--navy); }
.lbl{ margin-top:14px; text-align:center; max-width:270px; }
.lbl b{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:14.5px; }
.lbl b em{ font-style:normal; font-size:11px; font-weight:800; color:#111A2B; background:var(--gold2); border-radius:6px; padding:2px 7px; }
.lbl p{ font-size:12.5px; color:#9AA4B2; margin-top:4px; line-height:1.45; }
.lbl button{ margin-top:10px; height:32px; padding:0 14px; border-radius:8px; border:1px solid rgba(181,175,166,.35); background:rgba(255,255,255,.04); color:var(--silver2); font:600 12px Inter; cursor:pointer; }
@media (max-width:900px){ .row{ grid-template-columns:1fr; justify-items:center; } }

/* ---------- shared title ---------- */
.tt{ position:absolute; left:0; right:0; text-align:center; z-index:20; }
.tt small{ display:block; font-family:Cinzel,serif; font-size:10px; letter-spacing:.42em; color:var(--silver2); opacity:0; animation:fu .6s 1.25s ease both; }
.tt b{ display:block; font-family:'Playfair Display',serif; font-size:31px; font-weight:700; color:var(--ivory); margin:6px 0 4px; text-shadow:0 4px 20px rgba(0,0,0,.45); }
.tt b span{ display:inline-block; opacity:0; animation:lt .55s cubic-bezier(.2,.8,.2,1) both; }
.tt i{ display:block; width:70px; height:2px; margin:8px auto; background:linear-gradient(90deg,transparent,var(--gold2),transparent); transform:scaleX(0); animation:sx .7s 1.7s ease both; }
.tt em{ display:block; font-style:normal; font-size:12px; color:#C9CED6; opacity:0; animation:fu .6s 1.85s ease both; }
@keyframes fu{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@keyframes lt{ from{ opacity:0; transform:translateY(16px) rotateX(60deg); filter:blur(4px); } to{ opacity:1; transform:none; filter:none; } }
@keyframes sx{ to{ transform:scaleX(1); } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

/* ================= SEA 1 · Horizon sunrise ================= */
.s1{ background:linear-gradient(180deg,#0B1220 0%,#1A2741 38%,#4A4436 50%,#121B2C 50.2%,#0B1220 100%); }
.s1 .sun{ position:absolute; left:50%; top:50%; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:radial-gradient(circle,#F2E3BE 0%,#D8C39A 35%,rgba(181,154,106,0) 70%); animation:rise 2.4s cubic-bezier(.2,.7,.2,1) both; clip-path:inset(0 0 50% 0); }
.s1 .glow{ position:absolute; left:-20%; right:-20%; top:36%; height:28%; background:radial-gradient(ellipse at 50% 50%,rgba(216,195,154,.45),transparent 60%); animation:fade 2s both; }
.s1 .refl{ position:absolute; left:50%; top:50.5%; width:60px; height:40%; margin-left:-30px; background:repeating-linear-gradient(180deg,rgba(242,227,190,.55) 0 2px,transparent 2px 7px); mask-image:linear-gradient(180deg,#000,transparent); -webkit-mask-image:linear-gradient(180deg,#000,transparent); animation:shim 1.6s ease-in-out infinite alternate, fade 1.4s .6s both; }
.s1 .wv{ position:absolute; left:0; width:200%; bottom:0; --c:rgba(25,38,62,.55); }
.s1 .wv svg{ display:block; width:100%; height:14px; } .s1 .wv path{ fill:var(--c); } .s1 .wv::after{ content:''; display:block; height:100%; background:var(--c); }
.s1 .w1{ top:57%; animation:wave 9s linear infinite; } .s1 .w2{ top:67%; --c:rgba(17,26,43,.7); animation:wave 6s linear infinite reverse; } .s1 .w3{ top:80%; --c:rgba(11,18,32,.92); animation:wave 4.5s linear infinite; }
.s1 .ship{ position:absolute; top:calc(50% - 46px); left:18%; width:180px; animation:sail 2.6s cubic-bezier(.15,.7,.25,1) both, bob 2.2s 2.6s ease-in-out infinite; }
.s1 .wake{ position:absolute; top:calc(50% + 2px); left:68%; width:0; height:3px; border-radius:3px; background:linear-gradient(90deg,rgba(242,235,221,.7),transparent); animation:wk 2.6s .2s ease-out both; }
.s1 .tt{ top:70px; }
@keyframes rise{ from{ transform:translateY(70px); opacity:.2; } to{ transform:none; opacity:1; } }
@keyframes shim{ to{ transform:scaleX(1.5); opacity:.6; } }
@keyframes wave{ to{ transform:translateX(-50%); } }
@keyframes sail{ from{ transform:translateX(260px); } to{ transform:none; } }
@keyframes bob{ 50%{ transform:translateY(-2px) rotate(-.6deg); } }
@keyframes wk{ 0%{ width:0; left:68%; } 60%{ width:120px; } 100%{ width:40px; left:68%; opacity:.5; } }

/* ================= SEA 2 · Compass to route ================= */
.s2{ background:radial-gradient(circle at 50% 40%,#1C2B46 0%,#111A2B 65%); }
.s2 .grid{ position:absolute; inset:0; background-image:radial-gradient(rgba(181,175,166,.16) 1px,transparent 1.4px); background-size:12px 12px; animation:fade 1s both; }
.s2 .cmp{ position:absolute; left:50%; top:38%; width:180px; height:180px; margin:-90px 0 0 -90px; animation:cmpIn 1.3s cubic-bezier(.2,.8,.2,1) both, cmpOut .8s 1.3s cubic-bezier(.6,0,.3,1) forwards; }
.s2 .cmp .spin{ transform-origin:50% 50%; animation:cspin 1.3s cubic-bezier(.2,.8,.2,1) both; }
.s2 .route{ position:absolute; inset:0; }
.s2 .route path.r{ fill:none; stroke:var(--gold2); stroke-width:2; stroke-dasharray:4 5; stroke-dashoffset:0; }
.s2 .route .mask{ fill:none; stroke:#fff; stroke-width:6; stroke-dasharray:420; stroke-dashoffset:420; animation:draw 1.2s 1.55s ease-in-out forwards; }
.s2 .route circle{ fill:var(--gold2); opacity:0; animation:fade .4s 1.5s both; }
.s2 .route text{ fill:var(--silver2); font:700 9px Inter; letter-spacing:.1em; opacity:0; animation:fade .4s 1.6s both; }
.s2 .boat{ position:absolute; left:0; top:0; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:var(--ivory); box-shadow:0 0 0 5px rgba(216,195,154,.25), 0 0 18px rgba(216,195,154,.8); offset-path:path('M40 300 C 90 200, 160 330, 200 222'); offset-distance:0%; opacity:0; animation:boat 1.2s 1.55s ease-in-out forwards; display:flex; align-items:center; justify-content:center; }
.s2 .boat svg{ width:12px; height:12px; }
.s2 .tt{ top:350px; }
@keyframes cmpIn{ from{ opacity:0; transform:scale(.3); } to{ opacity:1; transform:none; } }
@keyframes cspin{ from{ transform:rotate(-420deg); } to{ transform:rotate(0); } }
@keyframes cmpOut{ to{ transform:translate(-62px,-150px) scale(.32); opacity:.85; } }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes boat{ 0%{ opacity:1; offset-distance:0%; } 100%{ opacity:1; offset-distance:100%; } }

/* ================= SEA 3 · Container wall reveal ================= */
.s3 .bg{ position:absolute; inset:0; background:url(/assets/images/hero_sea.jpg) center/cover; transform:scale(1.25); animation:zoomOut 2.6s 1s cubic-bezier(.2,.7,.2,1) both; }
.s3 .bg::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(17,26,43,.35),rgba(17,26,43,.85)); }
.s3 .half{ position:absolute; top:0; bottom:0; width:50%; display:grid; grid-template-columns:repeat(2,1fr); grid-auto-rows:44px; gap:3px; padding:3px; align-content:start; z-index:5; background:#0B1220; }
.s3 .half.l{ left:0; animation:openL .8s 1.25s cubic-bezier(.7,0,.3,1) forwards; } .s3 .half.r{ right:0; animation:openR .8s 1.25s cubic-bezier(.7,0,.3,1) forwards; }
.s3 .ct{ border-radius:3px; background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 2px,transparent 2px 7px), var(--c); box-shadow:inset 0 -6px 0 rgba(0,0,0,.18); opacity:0; animation:ctIn .45s cubic-bezier(.2,.8,.2,1) both; }
.s3 .tt{ top:220px; }
.s3 .tt small, .s3 .tt b span, .s3 .tt i, .s3 .tt em{ animation-delay:calc(var(--d,0s) + .45s); }
@keyframes ctIn{ from{ opacity:0; transform:translateX(var(--fx)); } to{ opacity:1; transform:none; } }
@keyframes openL{ to{ transform:translateX(-102%); } } @keyframes openR{ to{ transform:translateX(102%); } }
@keyframes zoomOut{ to{ transform:scale(1); } }

/* ================= AIR 1 · Runway take-off ================= */
.a1{ background:linear-gradient(180deg,#0B1220 0%,#16223A 45%,#111A2B 100%); }
.a1 .sky{ position:absolute; inset:0; background:linear-gradient(180deg,#1C2B46 0%,#6E5A38 60%,#D8C39A 100%); opacity:0; animation:fade 1s 1.2s both; }
.a1 .rw{ position:absolute; left:-60%; right:-60%; bottom:-30%; height:95%; transform:perspective(420px) rotateX(58deg); transform-origin:50% 100%; background:
  linear-gradient(90deg,transparent 30%,#202C40 30%,#202C40 70%,transparent 70%); animation:rwOut .8s 1.2s ease-in forwards; }
.a1 .rw::before{ content:''; position:absolute; left:49%; width:2%; top:0; bottom:0; background:repeating-linear-gradient(180deg,#DAD5CD 0 30px,transparent 30px 70px); animation:rush .35s linear infinite; }
.a1 .rw::after{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(180deg,#F2E3BE 0 6px,transparent 6px 40px) 29.5% 0/1% 100% no-repeat, repeating-linear-gradient(180deg,#F2E3BE 0 6px,transparent 6px 40px) 69.5% 0/1% 100% no-repeat; filter:drop-shadow(0 0 4px #F2E3BE); animation:rush2 .35s linear infinite; }
.a1 .plane{ position:absolute; left:50%; top:58%; width:150px; margin-left:-75px; animation:lift 1.6s .55s cubic-bezier(.5,0,.2,1) both; filter:drop-shadow(0 12px 18px rgba(0,0,0,.5)); }
.a1 .tt{ top:200px; }
@keyframes rush{ from{ background-position:0 0; } to{ background-position:0 70px; } }
@keyframes rush2{ from{ background-position:29.5% 0, 69.5% 0; } to{ background-position:29.5% 40px, 69.5% 40px; } }
@keyframes rwOut{ to{ transform:perspective(420px) rotateX(58deg) translateY(60%); opacity:0; } }
@keyframes lift{ 0%{ transform:translateY(60px) scale(.9); } 40%{ transform:translateY(30px) scale(1.05); } 100%{ transform:translateY(-300px) scale(.35); opacity:0; } }

/* ================= AIR 2 · Through the clouds ================= */
.a2{ background:linear-gradient(180deg,#19263E 0%,#4A5872 35%,#B9A57F 75%,#E9D9B5 100%); }
.a2 .layer{ position:absolute; inset:-20% -10%; }
.a2 .cl{ position:absolute; border-radius:50%; background:radial-gradient(ellipse at 50% 60%,rgba(255,250,240,.95) 0%,rgba(242,235,221,.7) 35%,rgba(242,235,221,0) 70%); filter:blur(9px); }
.a2 .sea{ position:absolute; left:-20%; right:-20%; bottom:-6%; height:42%; background:radial-gradient(ellipse at 20% 30%,#FFF8EC 0,transparent 40%),radial-gradient(ellipse at 60% 20%,#FBF3E3 0,transparent 42%),radial-gradient(ellipse at 90% 40%,#FFF8EC 0,transparent 38%),linear-gradient(180deg,rgba(242,235,221,0),#F2EBDD 45%); filter:blur(6px); animation:seaUp 2.4s cubic-bezier(.3,.6,.3,1) both; }
@keyframes seaUp{ from{ transform:translateY(-140%); opacity:0; } 40%{ opacity:1; } to{ transform:none; } }
.a2 .L1{ animation:camUp 2.4s cubic-bezier(.4,0,.2,1) both; } .a2 .L2{ animation:camUp2 2.4s cubic-bezier(.4,0,.2,1) both; } .a2 .L3{ animation:camUp3 2.4s cubic-bezier(.4,0,.2,1) both; }
.a2 .jet{ position:absolute; top:44%; left:-30%; width:86px; animation:jet 2.2s .7s cubic-bezier(.3,.6,.3,1) both; z-index:4; }
.a2 .trail{ position:absolute; top:calc(44% + 18px); right:100%; height:2px; width:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.9)); }
.a2 .jetw{ position:absolute; inset:0; animation:fade .2s .7s both; }
.a2 .tt{ top:78px; } .a2 .tt b{ color:#fff; } .a2 .tt em{ color:#F2EBDD; }
@keyframes camUp{ from{ transform:translateY(-10%); } to{ transform:translateY(95%); } }
@keyframes camUp2{ from{ transform:translateY(-30%); } to{ transform:translateY(120%); opacity:.6; } }
@keyframes camUp3{ from{ transform:translateY(-60%) scale(1.4); } to{ transform:translateY(160%) scale(1.4); } }
@keyframes jet{ from{ left:-30%; } to{ left:62%; } }

/* ================= AIR 3 · Globe flight path ================= */
.a3{ background:radial-gradient(circle at 50% 42%,#1C2B46 0%,#0B1220 70%); }
.a3 canvas{ position:absolute; left:50%; top:40%; width:240px; height:240px; margin:-120px 0 0 -120px; border-radius:50%; box-shadow:0 0 60px rgba(181,154,106,.25), inset -30px -20px 60px rgba(0,0,0,.6); background:radial-gradient(circle at 38% 32%,#22324D 0%,#111A2B 60%,#070C16 100%); animation:gIn .7s ease both, gZoom .7s 2.3s cubic-bezier(.6,0,.4,1) forwards; }
.a3 .tt{ top:372px; }
@keyframes gIn{ from{ opacity:0; transform:scale(.8); } to{ opacity:1; transform:none; } }
@keyframes gZoom{ to{ transform:scale(2.6); opacity:0; filter:blur(4px); } }

/* ================= WH 1 · Roller shutter ================= */
.w1 .bg{ position:absolute; inset:0; background:url(/assets/images/warehouse.jpg) center/cover; animation:kb 3s ease-out both; }
.w1 .bg::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(17,26,43,.55),rgba(17,26,43,.9)); }
.w1 .shut{ position:absolute; inset:0; z-index:5; background:repeating-linear-gradient(180deg,#4A505B 0 2px,#8A8C90 2px 5px,#B5AFA6 5px 14px,#6F737A 14px 18px); box-shadow:0 10px 30px rgba(0,0,0,.6); animation:flick .5s steps(2) both, roll 1s .55s cubic-bezier(.6,0,.25,1.1) forwards; }
.w1 .shut::after{ content:'VENTURE KART'; position:absolute; left:0; right:0; top:46%; text-align:center; font:700 13px Cinzel; letter-spacing:.3em; color:#111A2B; opacity:.55; }
.w1 .light{ position:absolute; left:0; right:0; bottom:0; height:0; z-index:4; background:linear-gradient(0deg,rgba(242,227,190,.45),transparent); animation:spill 1s .55s ease-out forwards, fadeO .8s 1.6s forwards; }
.w1 .tt{ top:240px; }
@keyframes flick{ 0%{ filter:brightness(.3); } 50%{ filter:brightness(1.1); } 100%{ filter:brightness(1); } }
@keyframes roll{ to{ transform:translateY(-101%); } }
@keyframes spill{ to{ height:70%; } }
@keyframes fadeO{ to{ opacity:0; } }
@keyframes kb{ from{ transform:scale(1.25); } to{ transform:scale(1.05); } }

/* ================= WH 2 · Isometric racks ================= */
.w2{ background:radial-gradient(circle at 50% 38%,#1C2B46 0%,#111A2B 70%); }
.w2 svg{ position:absolute; left:50%; top:36%; width:240px; height:240px; margin:-120px 0 0 -120px; overflow:visible; }
.w2 .rack line{ stroke:var(--silver); stroke-width:1.6; stroke-dasharray:200; stroke-dashoffset:200; animation:draw .7s ease forwards; }
.w2 .bx{ opacity:0; animation:drop .5s cubic-bezier(.3,1.4,.5,1) forwards; }
.w2 .tt{ top:350px; }
@keyframes drop{ from{ opacity:0; transform:translateY(-70px); } to{ opacity:1; transform:none; } }

/* ================= WH 3 · Blueprint ================= */
.w3{ background:#0F2036; }
.w3 .grid{ position:absolute; inset:0; background-image:linear-gradient(rgba(181,175,166,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(181,175,166,.08) 1px,transparent 1px),linear-gradient(rgba(181,175,166,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(181,175,166,.04) 1px,transparent 1px); background-size:48px 48px,48px 48px,12px 12px,12px 12px; animation:fade .6s both; }
.w3 > svg{ position:absolute; left:20px; right:20px; top:70px; width:calc(100% - 40px); }
.w3 .ln{ fill:none; stroke:var(--silver2); stroke-width:1.6; stroke-dasharray:600; stroke-dashoffset:600; animation:draw 1s ease forwards; }
.w3 .zn{ fill:var(--gold); opacity:0; animation:zf .4s ease forwards; }
.w3 text{ fill:var(--ivory); font:700 8.5px Inter; letter-spacing:.06em; opacity:0; animation:fade .3s ease forwards; }
.w3 .pin{ position:absolute; left:63%; top:128px; width:26px; animation:pin .6s 1.5s cubic-bezier(.3,1.5,.5,1) both; z-index:3; }
.w3 .rip{ position:absolute; left:calc(63% + 13px); top:158px; width:10px; height:10px; margin:-5px; border-radius:50%; border:2px solid var(--gold2); opacity:0; animation:rip 1.2s 1.9s ease-out infinite; }
.w3 .chip{ position:absolute; left:0; right:0; margin:0 auto; width:max-content; top:268px; white-space:nowrap; padding:6px 12px; border-radius:20px; background:rgba(216,195,154,.15); border:1px solid rgba(216,195,154,.5); color:var(--gold2); font:700 11px Inter; opacity:0; animation:fu .5s 2s both; }
.w3 .tt{ top:330px; }
@keyframes zf{ to{ opacity:.28; } }
@keyframes pin{ from{ opacity:0; transform:translateY(-60px); } to{ opacity:1; transform:none; } }
@keyframes rip{ from{ opacity:.9; transform:scale(1); } to{ opacity:0; transform:scale(5); } }

/* ---------- page layout: menu · stage · details ---------- */
body{ padding:0; min-height:100vh; display:grid; grid-template-columns:290px 1fr 320px; }
.menu{ background:linear-gradient(180deg,#0F1726,#0B1220); border-right:1px solid rgba(181,175,166,.12); padding:22px 16px; display:flex; flex-direction:column; gap:4px; min-height:100vh; position:sticky; top:0; max-height:100vh; overflow-y:auto; }
.brand{ display:flex; align-items:center; gap:10px; padding:0 6px 20px; margin-bottom:10px; border-bottom:1px solid rgba(181,175,166,.12); }
.brand img{ width:48px; } .brand b{ display:block; font-family:Cinzel,serif; font-size:15px; letter-spacing:.08em; } .brand small{ display:block; font-size:10.5px; letter-spacing:.14em; color:var(--gold2); font-weight:700; margin-top:2px; }
.grp{ font-family:Cinzel,serif; font-size:11px; letter-spacing:.2em; color:var(--gold2); padding:16px 10px 8px; display:flex; align-items:center; gap:8px; }
.grp svg{ width:16px; height:16px; fill:none; stroke:var(--gold2); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.mi{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:11px; cursor:pointer; color:#C9CED6; font-size:13.5px; font-weight:600; border:1px solid transparent; transition:background .2s,border-color .2s; text-align:left; background:none; font-family:inherit; width:100%; }
.mi:hover{ background:rgba(255,255,255,.04); }
.mi.on{ background:linear-gradient(90deg,rgba(181,154,106,.22),rgba(181,154,106,.04)); border-color:rgba(216,195,154,.35); color:#fff; }
.mi i{ font-style:normal; width:30px; height:24px; border-radius:6px; background:rgba(181,175,166,.12); color:var(--silver2); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
.mi.on i{ background:var(--gold2); color:#111A2B; }
.mi em{ margin-left:auto; font-style:normal; font-size:9.5px; font-weight:800; letter-spacing:.06em; color:var(--gold2); border:1px solid rgba(216,195,154,.4); border-radius:5px; padding:1px 5px; }
.stage{ display:flex; align-items:center; justify-content:center; padding:30px; background:radial-gradient(circle at 50% 40%,#18243A 0%,#0B1220 70%); min-height:100vh; }
.stage .ph{ transform:scale(1.18); }
.info{ border-left:1px solid rgba(181,175,166,.12); padding:34px 26px; background:#0D1422; display:flex; flex-direction:column; gap:14px; }
.info .k{ font-family:Cinzel,serif; font-size:11px; letter-spacing:.2em; color:var(--gold2); }
.info h2{ font-family:'Playfair Display',serif; font-size:28px; font-weight:600; line-height:1.15; }
.info p{ color:#AEB6C2; font-size:14px; line-height:1.6; }
.info .tags{ display:flex; flex-wrap:wrap; gap:6px; } .info .tags span{ font-size:11.5px; font-weight:600; color:var(--silver2); border:1px solid rgba(181,175,166,.25); border-radius:20px; padding:4px 10px; }
.info .btns{ display:flex; gap:10px; margin-top:6px; }
.info button{ height:42px; padding:0 18px; border-radius:10px; font:700 13px Inter; cursor:pointer; border:1px solid rgba(181,175,166,.35); background:none; color:var(--silver2); }
.info button.pri{ background:linear-gradient(135deg,#E6E2DB,#B5AFA6 50%,#8A847B); color:#111A2B; border:none; }
.info .nav{ margin-top:auto; display:flex; justify-content:space-between; font-size:12.5px; color:#8C94A1; }
.info .nav a{ cursor:pointer; color:var(--silver2); }

      var h = pj(HUB[0], HUB[1]); if (h[2] > 0){ ctx.globalAlpha = .3; ctx.fillStyle = '#D8C39A'; ctx.beginPath(); ctx.arc(h[0], h[1], 14, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(h[0], h[1], 5, 0, 6.283); ctx.fill(); }
      ctx.globalAlpha = 1; requestAnimationFrame(frame); }
    requestAnimationFrame(frame); }

  var scr = document.getElementById('scr'), cur = 0, loop = false, lt;
  function play(){ clearTimeout(lt); scr.innerHTML = T[LIST[cur][0]](); var cv = scr.querySelector('canvas'); if (cv) globe(cv); if (loop) lt = setTimeout(play, 4200); }
  function render(){ var it = LIST[cur], g = GROUPS.filter(function(x){ return x[0] === it[1]; })[0];
    document.getElementById('menu').innerHTML = GROUPS.map(function(G){ return '<div class="grp">' + G[2] + G[1] + '</div>' + LIST.map(function(x, i){ return x[1] !== G[0] ? '' : '<button class="mi' + (i === cur ? ' on' : '') + '" data-i="' + i + '"><i>' + x[0].toUpperCase() + '</i>' + x[2] + (REC[x[0]] ? '<em>PICK</em>' : '') + '</button>'; }).join(''); }).join('');
    document.getElementById('info').innerHTML = '<div class="k">' + g[1] + ' · ' + it[0].toUpperCase() + '</div><h2>' + it[2] + '</h2><p>' + it[3] + '</p><div class="tags">' + it[4].map(function(t){ return '<span>' + t + '</span>'; }).join('') + (REC[it[0]] ? '<span style="color:#111A2B;background:#D8C39A;border-color:#D8C39A">Recommended</span>' : '') + '</div>' +
      '<div class="btns"><button class="pri" data-play>&#9654; Play again</button></div><label><input type="checkbox" id="loop"' + (loop ? ' checked' : '') + '> Loop animation</label>' +
      '<p style="font-size:12.5px;color:#8C94A1">Tip: use ← → keys to switch concepts. Recommended set: S2 + A3 + W3 (all use the logo’s compass, globe and map style).</p>' +
      '<div class="nav"><a data-step="-1">← Previous</a><a data-step="1">Next →</a></div>';
    var on = document.querySelector('.mi.on'), mn = document.querySelector('.menu'); if (on && mn.scrollWidth > mn.clientWidth) mn.scrollLeft = on.offsetLeft - (mn.clientWidth - on.offsetWidth) / 2;
    try { history.replaceState(null, '', '#' + it[0]); } catch (e){} }
  function go(i){ cur = (i + LIST.length) % LIST.length; render(); play(); }
  document.addEventListener('click', function(e){ var t;
    if ((t = e.target.closest('[data-i]'))) go(+t.dataset.i);
    else if (e.target.closest('[data-play]')) play();
    else if ((t = e.target.closest('[data-step]'))) go(cur + +t.dataset.step); });
  document.addEventListener('change', function(e){ if (e.target.id === 'loop'){ loop = e.target.checked; play(); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1); if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1); });
  var h = location.hash.slice(1), hi = LIST.findIndex(function(x){ return x[0] === h; }); go(hi > -1 ? hi : 0);
})();
